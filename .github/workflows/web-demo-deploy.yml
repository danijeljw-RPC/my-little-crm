---
name: Web demo deploy

# Builds the browser demo (#30) with scripts/web-demo.sh, checks that
# sqlite3.wasm is real WebAssembly, publishes build/web to Cloudflare Pages and
# then checks the live site (#61). Release runs it after publishing a GitHub
# release; it can also be started by hand from the Actions tab (main only).
# Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets: see
# docs/WEB-DEMO.md#cloudflare-pages.

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-demo-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: web-demo
      url: https://my-little-crm-demo.repasscloud.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: flutter pub get
      - name: Build, check, deploy and verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_SITE: https://my-little-crm-demo.repasscloud.com
        run: |
          [[ -n $CLOUDFLARE_API_TOKEN && -n $CLOUDFLARE_ACCOUNT_ID ]] \
            || { echo "::error::set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets"; exit 1; }
          scripts/web-demo.sh deploy
