name: Android APK (test)

# Builds and verifies ONLY the release-signed Android APK, the same way the
# "Build Android APK" job in release.yml does, without spending Windows/macOS
# minutes and without publishing anything.
#
# Run it by pushing to the ci/android-apk branch, or by hand:
#   gh workflow run android-apk.yml --ref <branch>
# (manual runs need this file on the default branch).
#
# Not triggered by pull requests, so it never adds to PR validation minutes.

on:
  push:
    branches: [ci/android-apk]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with release.yml.
  FLUTTER_VERSION: '3.47.9'

jobs:
  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Write release keystore and android/key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          [[ -n $KEYSTORE_BASE64 && -n $KEYSTORE_PASSWORD ]] \
            || { echo "::error::set the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets"; exit 1; }
          keystore="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-mylittlecrm}"
            echo "storeFile=$keystore"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release
        env:
          MLC_RELEASE_SIGNING: '1'
      - name: Verify signature
        run: scripts/ci/verify-apk.sh build/app/outputs/flutter-apk/app-release.apk
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-apk-test
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 3
