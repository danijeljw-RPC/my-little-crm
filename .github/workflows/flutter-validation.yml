name: Flutter validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR supersedes the running validation.
concurrency:
  group: flutter-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Match the SDK used for local and native acceptance.
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Native SQLite (FTS4/FTS5 as shipped on macOS) through the real app build.
  # macos-integration:
  #   name: macOS integration
  #   runs-on: macos-15
  #   timeout-minutes: 30
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #     - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
  #       with:
  #         # Match the SDK used for local and native acceptance.
  #         flutter-version: '3.47.9'
  #         channel: stable
  #         cache: true
  #     - run: flutter config --enable-macos-desktop
  #     - run: flutter pub get
  #     - run: flutter test integration_test/core_journey_test.dart -d macos

  # The same journey on the Linux desktop build, which uses the FFI/FTS5 path.
  linux-integration:
    name: Linux integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Install Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsqlite3-dev xvfb
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: xvfb-run -a flutter test integration_test/core_journey_test.dart -d linux

  # The browser demo (#30): Flutter WebAssembly, DEMO_MODE, in-memory SQLite.
  # Produces the static site as an artifact; web-demo-deploy.yml publishes it on release.
  web-demo:
    name: Web demo (Wasm)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y zsh
      - run: flutter pub get
      # Fetches sqlite3.wasm at the version pinned by pubspec.lock, then runs
      # `flutter build web --release --wasm --dart-define=DEMO_MODE=true`.
      # No secrets: DEMO_MODE is the only define, and this job reads none.
      - run: scripts/web-demo.sh build
      # Required files, real WebAssembly in sqlite3.wasm (#61), no stray files.
      - run: scripts/ci/check-web-demo.sh build/web
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-demo
          path: build/web
          # The site needs .htaccess (Apache/cPanel config); hidden files are
          # skipped by default.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
