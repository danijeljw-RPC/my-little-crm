name: Flutter validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR supersedes the running validation.
concurrency:
  group: flutter-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          # Match the SDK used for local and native acceptance.
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Native SQLite (FTS4/FTS5 as shipped on macOS) through the real app build.
  # macos-integration:
  #   name: macOS integration
  #   runs-on: macos-15
  #   timeout-minutes: 30
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #     - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
  #       with:
  #         # Match the SDK used for local and native acceptance.
  #         flutter-version: '3.47.9'
  #         channel: stable
  #         cache: true
  #     - run: flutter config --enable-macos-desktop
  #     - run: flutter pub get
  #     - run: flutter test integration_test/core_journey_test.dart -d macos

  # The same journey on the Linux desktop build, which uses the FFI/FTS5 path.
  linux-integration:
    name: Linux integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true
      - name: Install Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsqlite3-dev xvfb
      - run: flutter config --enable-linux-desktop
      - run: flutter pub get
      - run: xvfb-run -a flutter test integration_test/core_journey_test.dart -d linux
