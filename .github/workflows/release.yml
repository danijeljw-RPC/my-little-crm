name: Release

# Push a commit to main whose whole message is "release" (e.g. `git commit --allow-empty -m release`)
# and this builds Android, macOS and Windows from that commit, then publishes GitHub release
# v<version> with the version from pubspec.yaml and the notes from that CHANGELOG.md section.
# It can also be started by hand from the Actions tab (main only). See docs/ANDROID-RELEASE.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.9'

jobs:
  prepare:
    name: Check version and notes
    # GitHub compares strings case-insensitively, so "Release" works too.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'release')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read version from pubspec.yaml
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          full=$(grep -m1 '^version:' pubspec.yaml | sed 's/^version:[[:space:]]*//; s/[[:space:]]*$//')
          version=${full%%+*}
          [[ -n $version && $full == *+* ]] || { echo "::error::pubspec.yaml version needs a build number, e.g. 1.0.1+16 (got '$full')"; exit 1; }
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "::error::release v$version already exists; bump the version in pubspec.yaml"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (pubspec $full)"
      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p notes
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[|^\[[0-9.]+\]:/ {f=0} f' \
            CHANGELOG.md > notes/notes.md
          [[ -s notes/notes.md ]] || { echo "::error::CHANGELOG.md has no '## [$VERSION]' section"; exit 1; }
          name="my-little-crm-$VERSION"
          cat >> notes/notes.md <<EOF

          ### Downloads

          | Platform | File |
          |---|---|
          | Android | \`$name-android.apk\` |
          | macOS (Apple silicon + Intel) | \`$name-macos.zip\` |
          | Windows 10/11 (x64) | \`$name-windows-x64.zip\` |

          Each file has a matching \`.sha256\` checksum.

          - **Android:** open the APK on your phone and allow "Install unknown apps" when asked.
          - **macOS:** unzip and move **My Little CRM** to Applications. The app isn't notarized,
            so the first time, open it, then go to **System Settings → Privacy & Security** and
            choose **Open Anyway**.
          - **Windows:** unzip the whole folder anywhere and run \`my_little_crm.exe\`. If
            SmartScreen warns about an unrecognised app, choose **More info → Run anyway**.
          EOF
          cat notes/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes/notes.md
          if-no-files-found: error

  android:
    name: Build Android APK
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Write release keystore and android/key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          [[ -n $KEYSTORE_BASE64 && -n $KEYSTORE_PASSWORD ]] \
            || { echo "::error::set the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets"; exit 1; }
          keystore="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=${KEY_ALIAS:-mylittlecrm}"
            echo "storeFile=$keystore"
          } > android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release
        env:
          MLC_RELEASE_SIGNING: '1'
      - name: Verify signature and package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          apk=build/app/outputs/flutter-apk/app-release.apk
          signer=$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate DN: //p')
          echo "Signer: $signer"
          [[ -n $signer ]] || { echo "::error::could not read the APK signer"; exit 1; }
          [[ $signer != *"CN=Android Debug"* ]] || { echo "::error::APK is signed with the DEBUG key"; exit 1; }
          mkdir -p dist
          cp "$apk" "dist/my-little-crm-$VERSION-android.apk"
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" android/key.properties
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: dist/
          if-no-files-found: error

  macos:
    name: Build macOS app
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Verify and package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          app="build/macos/Build/Products/Release/My Little CRM.app"
          codesign --verify --deep --strict "$app"
          lipo -archs "$app/Contents/MacOS/My Little CRM"
          mkdir -p dist
          # ditto keeps the bundle's symlinks, permissions and signature intact (zip -r doesn't).
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/my-little-crm-$VERSION-macos.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: dist/
          if-no-files-found: error

  windows:
    name: Build Windows app
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $name = "my-little-crm-$env:VERSION-windows-x64"
          New-Item -ItemType Directory -Force -Path staging, dist | Out-Null
          Copy-Item -Recurse build/windows/x64/runner/Release "staging/$name"
          Compress-Archive -Path "staging/$name" -DestinationPath "dist/$name.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [prepare, android, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          mv artifacts/android/* artifacts/macos/* artifacts/windows/* dist/
          cd dist
          for f in *; do sha256sum "$f" > "$f.sha256"; done
          ls -l
          gh release create "$TAG" * \
            --repo "$GITHUB_REPOSITORY" \
            --title "My Little CRM $VERSION" \
            --notes-file ../artifacts/notes/notes.md \
            --target "$GITHUB_SHA"
